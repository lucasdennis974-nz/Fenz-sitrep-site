<!doctype html>
<html lang="en-NZ">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FENZ Sitrep (ER:LC)</title>
<style>
  :root{--red:#c8102e;--dark:#1b1b1f;--bg:#f2f2f4;--card:#fff;--line:#d6d6dc;--ok:#1a7f37}
  *{box-sizing:border-box}
  body{margin:0;font:14px/1.4 system-ui,Segoe UI,Arial,sans-serif;background:var(--bg);color:var(--dark)}
  header{background:var(--red);color:#fff;padding:12px 18px;display:flex;align-items:center;gap:14px}
  header h1{font-size:18px;margin:0;letter-spacing:.5px}
  header small{opacity:.85}
  main{display:grid;grid-template-columns:320px 1fr;gap:14px;padding:14px;max-width:1300px;margin:auto}
  @media(max-width:850px){main{grid-template-columns:1fr}}
  .card{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:12px}
  .card h2{font-size:13px;text-transform:uppercase;letter-spacing:.6px;margin:0 0 8px;color:var(--red)}
  label{display:block;font-size:12px;font-weight:600;margin:8px 0 2px}
  input,select,textarea{width:100%;padding:7px 8px;border:1px solid var(--line);border-radius:5px;font:inherit;background:#fff}
  textarea{min-height:70px;resize:vertical}
  .row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  button{background:var(--red);color:#fff;border:0;border-radius:5px;padding:8px 12px;font:inherit;font-weight:600;cursor:pointer}
  button.alt{background:#fff;color:var(--dark);border:1px solid var(--line)}
  .btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
  #feed{max-height:70vh;overflow:auto}
  .call{border:1px solid var(--line);border-left:4px solid var(--red);border-radius:5px;padding:8px;margin-bottom:8px;cursor:pointer}
  .call:hover{background:#fafafb}
  .call b{display:block}
  .call small{color:#666}
  .tag{display:inline-block;background:#eee;border-radius:3px;padding:0 5px;font-size:11px;margin-right:4px}
  .tag.fire{background:#ffd9d9}
  #status{font-size:12px;margin:0 0 8px}
  #status.on{color:var(--ok)}
  pre{white-space:pre-wrap;background:#101014;color:#e8e8ee;padding:12px;border-radius:6px;font:13px/1.45 ui-monospace,Consolas,monospace;margin:10px 0 0}
</style>
</head>
<body>
<header>
  <h1>FENZ — SITUATION REPORT</h1>
  <small>Fire and Emergency New Zealand · ER:LC</small>
</header>
<main>
  <section class="card">
    <h2>Incoming calls</h2>
    <p id="status">Not connected</p>
    <div class="btns" style="margin:0 0 10px">
      <button id="connect">Connect live</button>
      <button class="alt" id="load">Load calls.json</button>
    </div>
    <input type="file" id="file" accept=".json" hidden>
    <div id="feed"><small>Run <code>python erlc_calls.py</code>, then press Connect live. Click a call to fill the sitrep.</small></div>
  </section>

  <section class="card">
    <h2>Sitrep</h2>
    <div class="row">
      <div><label>Incident no.</label><input id="inc" placeholder="F1234567"></div>
      <div><label>Report no.</label><input id="rep" type="number" value="1" min="1"></div>
    </div>
    <div class="row">
      <div><label>Date / time</label><input id="dt"></div>
      <div><label>Incident type</label>
        <select id="type">
          <option>Structure fire</option><option>Vehicle fire</option><option>Vegetation fire</option>
          <option>Motor vehicle accident</option><option>Medical assist</option><option>Hazmat</option>
          <option>Rescue</option><option>Alarm activation</option><option>Other</option>
        </select></div>
    </div>
    <label>Location</label><input id="loc" placeholder="Street / postal / landmark">
    <div class="row">
      <div><label>Status</label>
        <select id="status2">
          <option>Going</option><option>Under control</option><option>Contained</option><option>Extinguished</option><option>Handed over</option>
        </select></div>
      <div><label>Alarm level</label>
        <select id="alarm"><option>1st</option><option>2nd</option><option>3rd</option><option>4th</option></select></div>
    </div>
    <label>Officer in charge (OIC)</label><input id="oic" placeholder="Callsign / name">
    <label>Appliances / units attending</label><input id="app" placeholder="e.g. Pump 1, Pump 2, Rescue 1">
    <label>Situation on arrival</label><textarea id="sit"></textarea>
    <label>Actions taken</label><textarea id="act"></textarea>
    <div class="row">
      <div><label>Hazards</label><input id="haz" placeholder="e.g. Power lines, fuel"></div>
      <div><label>Persons (inj / evac / missing)</label><input id="ppl" placeholder="0 / 0 / 0"></div>
    </div>
    <div class="row">
      <div><label>Other agencies</label><input id="oth" placeholder="Police, Ambulance"></div>
      <div><label>Further resources</label><input id="res" placeholder="None / request..."></div>
    </div>
    <label>Next update</label><input id="next" placeholder="e.g. 15 mins or on change">
    <div class="btns">
      <button id="gen">Generate sitrep</button>
      <button class="alt" id="copy">Copy</button>
      <button class="alt" id="now">Set time now</button>
    </div>
    <pre id="out">Fill in the form and press Generate.</pre>
  </section>
</main>

<script>
const $ = id => document.getElementById(id);
let es = null, timer = null, shown = new Set();

function nowNZ(){
  return new Date().toLocaleString('en-NZ',{timeZone:'Pacific/Auckland',hour12:false,
    day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'});
}
$('dt').value = nowNZ();
$('now').onclick = () => $('dt').value = nowNZ();

function esc(s){return String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}

function render(calls){
  if(!calls.length){ $('feed').innerHTML='<small>No calls yet…</small>'; return; }
  $('feed').innerHTML = calls.map((c,i)=>`
    <div class="call" data-i="${i}">
      <b>${esc(c.description || c.caller || 'Emergency call')}</b>
      ${c.team?`<span class="tag ${/fire/i.test(c.team)?'fire':''}">${esc(c.team)}</span>`:''}
      <small>${esc(c.location||'')} ${c.caller?'· '+esc(c.caller):''}</small>
    </div>`).join('');
  document.querySelectorAll('.call').forEach(el=>{
    el.onclick = () => useCall(calls[+el.dataset.i]);
  });
}

function useCall(c){
  $('loc').value = c.location || '';
  $('sit').value = c.description || '';
  if(!$('inc').value) $('inc').value = 'F' + String(c.id).replace(/\D/g,'').slice(-7).padStart(7,'0');
  const d = (c.description||'').toLowerCase();
  const map = [['vehicle fire','Vehicle fire'],['car fire','Vehicle fire'],['grass|scrub|bush|vegetation','Vegetation fire'],
    ['crash|mva|accident|collision','Motor vehicle accident'],['medical|ambulance','Medical assist'],
    ['hazmat|chemical|spill|gas','Hazmat'],['rescue|trapped','Rescue'],['alarm','Alarm activation'],['fire|smoke|burning','Structure fire']];
  for(const [re,val] of map){ if(new RegExp(re).test(d)){ $('type').value = val; break; } }
}

async function pull(){
  try{
    const r = await fetch('http://localhost:8787/calls');
    const calls = await r.json();
    $('status').textContent = 'Live · ' + calls.length + ' calls';
    $('status').className = 'on';
    render(calls);
  }catch(e){
    $('status').textContent = 'Can\'t reach erlc_calls.py (is it running?)';
    $('status').className = '';
  }
}
$('connect').onclick = () => { clearInterval(timer); pull(); timer = setInterval(pull, 5000); };

$('load').onclick = () => $('file').click();
$('file').onchange = async e => {
  const f = e.target.files[0]; if(!f) return;
  try{ const calls = JSON.parse(await f.text()); $('status').textContent='Loaded file · '+calls.length+' calls'; render(calls); }
  catch{ $('status').textContent='Not a valid calls.json'; }
};

function gen(){
  const L = [];
  L.push('**FENZ SITUATION REPORT #' + $('rep').value + '**');
  L.push('Incident: ' + ($('inc').value||'—') + ' | ' + $('dt').value + ' NZT');
  L.push('Type: ' + $('type').value + ' | Alarm: ' + $('alarm').value);
  L.push('Location: ' + ($('loc').value||'—'));
  L.push('Status: **' + $('status2').value.toUpperCase() + '**');
  L.push('OIC: ' + ($('oic').value||'—'));
  L.push('Attending: ' + ($('app').value||'—'));
  if($('sit').value) L.push('Situation: ' + $('sit').value);
  if($('act').value) L.push('Actions: ' + $('act').value);
  if($('haz').value) L.push('Hazards: ' + $('haz').value);
  if($('ppl').value) L.push('Persons (inj/evac/missing): ' + $('ppl').value);
  if($('oth').value) L.push('Other agencies: ' + $('oth').value);
  L.push('Further resources: ' + ($('res').value||'None'));
  L.push('Next update: ' + ($('next').value||'On change'));
  $('out').textContent = L.join('\n');
}
$('gen').onclick = gen;
$('copy').onclick = async () => { gen(); try{ await navigator.clipboard.writeText($('out').textContent); $('copy').textContent='Copied'; setTimeout(()=>$('copy').textContent='Copy',1200);}catch{} };
</script>
</body>
</html>
